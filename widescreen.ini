; widescreen.ini - Widescreen fix for SimTractor 3.5 (V3.66f) / szeroki ekran dla SimTractor 3.5 (V3.66f)
; Changes take effect after restarting the game. / Zmiany wchodza w zycie po ponownym uruchomieniu gry.
; Requires ORIGINAL game files. / Wymaga ORYGINALNYCH plikow gry.

[Display]
Width=1920            ; fullscreen resolution / rozdzielczosc pelnoekranowa
Height=1080
WindowWidth=1280      ; window size in windowed mode (0 = same as Width) / rozmiar okna (0 = jak Width)
WindowHeight=720      ; (0 = same as Height / jak Height)

[Camera]
HorPlus=1             ; 1 = Hor+ FOV (wider view, no stretching); 0 = original FOV / 1 = Hor+ FOV; 0 = oryginalne FOV
RemoveLetterbox=1     ; 1 = remove black bars / usuwa czarne pasy
ReferenceAspect=1.3333; aspect the game was designed for (4:3) / proporcje, dla ktorych zaprojektowano gre (4:3)

[Debug]
Log=1                 ; 1 = write widescreen.log / zapisuj widescreen.log
LogUi=0               ; 1 = verbose UI log (for bug reports) / 1 = szczegolowy log UI (do zglaszania bledow)

[UI]
UiAspect=1.3333       ; menu/HUD area aspect, centered on screen / proporcje obszaru menu/HUD, wysrodkowanego
UiCenter=1            ; 1 = center menu/HUD, 0 = left edge / 1 = srodek ekranu, 0 = lewa krawedz
LeftAnchor=verrou.Copy,cam+.Copy.Copy,Alarm,verrou,menuInfo,menuInfo.Copy,lobby,menu2,New Object
; Text scale (chat, button labels, top log). Size = screen_height/480 * TextScale. 0 = off.
; Skala tekstu (czat, etykiety, gorny log). Rozmiar = wysokosc_ekranu/480 * TextScale. 0 = wylaczone.
TextScale=1
; Entry formats / formaty wpisow:
;   Name*M@V^Y>D  scaled with resolution; M = extra multiplier, V = extra multiplier reaching V at 1080p,
;                 Y = vertical stretch, D = shift right (640x480 units)
;   Name=M^Y>D    relative multiplier only (for texts the game already scales)
TextScaleList=Title Bar Frame*0.45@0.8^1.2,Chat Message Frame*0.5@0.77^1.5,Chat Input Frame*0.4@0.77^1.3,Create 2D Frame,Create 2D Frame.Copy,Create 2D Frame.Copy.Copy,Session Frame*0.6@0.8,Session Player Count Frame*0.6@0.8,Player Frame*0.4@0.8^1.3,Sessions Info 2D Frame=0.85,Players Info 2D Frame=0.85>1.5
